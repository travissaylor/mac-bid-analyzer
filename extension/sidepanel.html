<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mac.bid Analyzer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #333;
    }
    #no-lot-message {
      text-align: center;
      padding: 32px 16px;
      color: #666;
    }
    #no-lot-message p {
      font-size: 14px;
      line-height: 1.5;
    }
    #lot-info {
      display: none;
    }
    #lot-identifier {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: #fff;
    }
    .btn-primary:hover {
      background-color: #43a047;
    }
    .btn-secondary {
      background-color: #757575;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #616161;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #loading-indicator {
      display: none;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
    }
    #error-message {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      background-color: #ffebee;
      color: #c62828;
      border-radius: 4px;
      font-size: 13px;
    }
    #results {
      display: none;
      margin-top: 16px;
    }
    #results-data {
      background-color: #f5f5f5;
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.4;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #actions {
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="no-lot-message">
    <p>Navigate to a mac.bid lot page to analyze</p>
  </div>
  <div id="lot-info">
    <div id="lot-identifier"></div>
    <div id="actions"></div>
    <div id="loading-indicator">Analyzing lot...</div>
    <div id="error-message"></div>
    <div id="results">
      <pre id="results-data"></pre>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
