<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mac.bid Analyzer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #333;
      overflow-y: auto;
    }
    #no-lot-message {
      text-align: center;
      padding: 32px 16px;
      color: #666;
    }
    #no-lot-message p {
      font-size: 14px;
      line-height: 1.5;
    }
    #lot-info {
      display: none;
    }
    #lot-identifier {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: #fff;
    }
    .btn-primary:hover {
      background-color: #43a047;
    }
    .btn-secondary {
      background-color: #757575;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #616161;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #loading-indicator {
      display: none;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
    }
    #error-message {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      background-color: #ffebee;
      color: #c62828;
      border-radius: 4px;
      font-size: 13px;
    }
    #results {
      display: none;
      margin-top: 16px;
    }
    #actions {
      margin-top: 12px;
    }

    /* Analysis results styling */
    .analysis-header {
      margin-bottom: 12px;
    }
    .product-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .lot-meta {
      font-size: 12px;
      color: #666;
    }
    .max-bid-banner {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .max-bid-banner .label {
      font-weight: 400;
      font-size: 12px;
      display: block;
      margin-bottom: 2px;
    }
    .max-bid-banner .bid-value {
      font-size: 20px;
    }
    .max-bid-banner.good-deal {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    .max-bid-banner.over-max {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    .max-bid-banner.neutral {
      background-color: #f5f5f5;
      color: #555;
      border: 1px solid #ddd;
    }
    .deal-score {
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
    }
    .manual-review-warning {
      background-color: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .section {
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      padding: 8px 12px;
      background-color: #fafafa;
      border-bottom: 1px solid #e0e0e0;
    }
    .section-body {
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .section-body .row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }
    .section-body .row .label {
      color: #666;
    }
    .section-body .row .value {
      font-weight: 500;
      text-align: right;
    }
    .price-range {
      display: flex;
      justify-content: space-between;
      text-align: center;
      margin: 4px 0;
    }
    .price-range .price-col {
      flex: 1;
    }
    .price-range .price-col .price-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }
    .price-range .price-col .price-value {
      font-size: 14px;
      font-weight: 600;
    }
    .reasoning-text {
      font-size: 12px;
      color: #555;
      font-style: italic;
      margin-top: 6px;
      line-height: 1.4;
    }
    .comparable-item {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 2px 0;
      color: #555;
    }
    .image-flag {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 12px;
    }
    .severity-badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .severity-high {
      background-color: #ffcdd2;
      color: #b71c1c;
    }
    .severity-medium {
      background-color: #fff9c4;
      color: #f57f17;
    }
    .severity-low {
      background-color: #e0e0e0;
      color: #616161;
    }
    .source-footer {
      font-size: 11px;
      color: #999;
      text-align: right;
      margin-top: 8px;
    }
    #feedback-section {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }
    #feedback-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 6px;
    }
    #feedback-textarea {
      width: 100%;
      min-height: 64px;
      font-family: inherit;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      box-sizing: border-box;
    }
    #feedback-actions {
      margin-top: 8px;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      margin-left: 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background-color: #e3f2fd;
      color: #1565c0;
      border: 1px solid #90caf9;
      vertical-align: middle;
    }
</style>
</head>
<body>
  <div id="no-lot-message">
    <p>Navigate to a mac.bid lot page to analyze</p>
  </div>
  <div id="lot-info">
    <div id="lot-identifier"></div>
    <div id="feedback-section">
      <label id="feedback-label" for="feedback-textarea">Correction / context</label>
      <textarea id="feedback-textarea" placeholder="Add notes to correct or guide the analysis (e.g. 'this is actually a 2nd-gen model', 'box shows water damage')"></textarea>
      <div id="feedback-actions">
        <button id="feedback-submit" class="btn btn-primary" type="button">Save &amp; re-analyze</button>
      </div>
    </div>
    <div id="actions"></div>
    <div id="loading-indicator">Analyzing lot...</div>
    <div id="error-message"></div>
    <div id="results">
      <div id="results-data"></div>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
