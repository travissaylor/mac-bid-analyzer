<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mac.bid Analyzer Settings</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      color: #333;
      max-width: 480px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px 0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .btn {
      display: inline-block;
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: #fff;
    }
    .btn-primary:hover {
      background-color: #43a047;
    }
    #status {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }
    #status.success {
      display: block;
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    #status.error {
      display: block;
      background-color: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>
  <h1>mac.bid Analyzer Settings</h1>
  <form id="settings-form">
    <div class="form-group">
      <label for="backend-url">Backend URL</label>
      <input type="text" id="backend-url" placeholder="http://localhost:3000">
      <div class="hint">The URL of your mac-bid-analyzer server.</div>
    </div>
    <div class="form-group">
      <label for="api-token">API Token</label>
      <input type="password" id="api-token" placeholder="Enter your API token">
      <div class="hint">Required for authenticating with the backend.</div>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
